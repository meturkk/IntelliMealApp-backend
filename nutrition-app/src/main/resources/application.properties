spring.application.name=nutrition-app

# Port configuration (Compatible with Render's PORT env var)
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SMTP settings for email verification (configure for your mail provider)
 spring.mail.host=smtp.gmail.com
 spring.mail.port=465
 spring.mail.username=${MAIL_USERNAME}
 spring.mail.password=${MAIL_PASSWORD}
 spring.mail.properties.mail.smtp.auth=true
 spring.mail.properties.mail.smtp.ssl.enable=true
 spring.mail.properties.mail.smtp.starttls.enable=false
# JWT signing key (Base64, at least 256 bits). Set JWT_SECRET in the environment, e.g. on Render.
# Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
